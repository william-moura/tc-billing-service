name: Deploy Laravel App to Hostinger VPS (Isolated)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tc-billing-service:latest

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH Deploy and Rollout on Hostinger VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: root
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 5m
          command_timeout: 5m
          script: |
            set -e
            cd ~/saga-oficina/tc-billing-service
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}

            docker build -t tc-billing-service:latest .
            docker save tc-billing-service:latest | sudo k3s ctr images import -
            docker image prune -f

            sudo k3s kubectl rollout restart deployment/billing-api -n saga-oficina
            sudo k3s kubectl rollout status deployment/billing-api -n saga-oficina --timeout=90s